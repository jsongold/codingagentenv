name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.27"
      - run: bash test/hooks.test.sh
      - run: bash test/harness.test.sh
      - run: go test ./...
        working-directory: cad
      - run: go test ./...
        working-directory: orchd
