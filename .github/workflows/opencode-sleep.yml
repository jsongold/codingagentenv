# Mac 睡眠時に `ai` ラベルの Issue を opencode が PR にする（ADR-0010）
name: opencode-sleep

on:
  issues:
    types: [labeled]

jobs:
  opencode:
    if: github.event.label.name == 'ai' && !contains(github.event.issue.labels.*.name, 'wip')
    concurrency:
      group: opencode-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: lock
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create wip --force
          gh issue edit ${{ github.event.issue.number }} --add-label wip

      # use_github_token: true だと action は git の認証も user も設定しない（github.handler.ts の configureGit は OIDC 時だけ）。
      # push できるよう checkout に token を残し、commit 用の user を設定する。
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.OPENCODE_GH_PAT || github.token }}
      - run: git config --global user.name opencode-agent && git config --global user.email opencode-agent@users.noreply.github.com

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # action は use_github_token 時に GITHUB_TOKEN を読む。GITHUB_TOKEN で作った PR は CI を起動しないので PAT を優先する
          GITHUB_TOKEN: ${{ secrets.OPENCODE_GH_PAT || github.token }}
        with:
          model: opencode-go/deepseek-v4-pro
          use_github_token: true
          prompt: |
            Implement GitHub issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            Rules:
            - You are already on a fresh branch. Do not switch or create branches, do not push, do not open a PR:
              the action commits, pushes and opens the PR (with "Closes #${{ github.event.issue.number }}") from your final answer.
            - Keep the change minimal. Run the repo's tests: `bash test/hooks.test.sh`, `bash test/harness.test.sh`,
              and `cd cad && go test ./...` when Go files change. Fix failures before finishing.
            - End your final answer with "Closes #${{ github.event.issue.number }}" and a "Verified" list of each command you ran and its result.

      - name: unlock on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue edit ${{ github.event.issue.number }} --remove-label wip
          gh issue comment ${{ github.event.issue.number }} --body "opencode run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
